apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-db-v2
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-db-v2
  template:
    metadata:
      labels:
        app: grafana-db-v2
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: POSTGRES_DB
              value: grafana
            - name: POSTGRES_USER
              value: grafana
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db-secret
                  key: password
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: grafana-db-pvc-v2
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-db-v2
  namespace: monitoring
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: grafana-db-v2
