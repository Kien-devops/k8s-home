apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-policies
  namespace: argocd
  labels:
    app.kubernetes.io/name: security-policies
    app.kubernetes.io/part-of: platform
spec:
  project: platform
  source:
    repoURL: https://github.com/Kien-devops/k8s-home.git
    targetRevision: main
    path: deploy/platform/security/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
