apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # AppProjects (Infrastructure definition)
  - ../projects/hospital.yaml
  - ../projects/platform.yaml

  # Platform Namespaces
  - ../applications/platform/namespaces.yaml

  # Platform Core Applications
  - ../applications/platform/traefik.yaml
  - ../applications/platform/hospital-redis-ha-app.yaml
  - ../applications/platform/kube-prometheus-stack.yaml
  - ../applications/platform/monitoring-config.yaml
  - ../applications/platform/loki.yaml
  - ../applications/platform/promtail.yaml
  - ../applications/platform/logging-config.yaml
  - ../applications/platform/kyverno.yaml
  - ../applications/platform/security-config.yaml
  - ../applications/platform/trivy-operator.yaml
  - ../applications/platform/falco.yaml
  - ../applications/platform/external-secrets.yaml

  # Workload Applications (Production Only)
  - ../applications/workloads/hospital-frontend-prod.yaml
  - ../applications/workloads/hospital-backend-prod.yaml
