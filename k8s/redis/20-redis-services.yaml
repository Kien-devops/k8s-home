apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: hospital
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: hospital
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
