apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: hospital
data:
  redis-start.sh: |
    #!/bin/sh
    set -eu

    REDIS_CONF="/tmp/redis.conf"

    cat > "${REDIS_CONF}" <<EOF
    bind 0.0.0.0
    protected-mode no
    port 6379
    dir /data
    appendonly yes
    requirepass ${REDIS_PASSWORD}
    EOF

    exec redis-server "${REDIS_CONF}"
