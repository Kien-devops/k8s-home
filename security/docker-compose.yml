services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:?SONAR_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${SONAR_POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - security-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_POSTGRES_USER:-sonar} -d ${SONAR_POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - security-internal

  nexus:
    image: sonatype/nexus3:3.92.0
    container_name: nexus
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=1024m"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXUS_PORT:-8081}:8081"
      - "${BIND_ADDRESS:-0.0.0.0}:8082:8082"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - security-internal

networks:
  security-internal:
    driver: bridge

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  nexus-data:
